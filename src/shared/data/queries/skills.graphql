query Skills($locale: I18NLocaleCode, $sort: [String], $techSort: [String]) {
  portfolio(locale: $locale) {
    documentId
    skills(sort: $sort) {
      id
      skill_group {
        name
        short_description
      }
      technologies(sort: $techSort) {
        documentId
        name
        proficiency_level
      }
      icon {
        documentId
        name
        width
        height
        url
      }
    }
  }
}
